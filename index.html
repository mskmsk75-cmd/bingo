<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴ当選番号モニター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      user-select: none;
      outline: none;
    }
    
    .main-container {
      display: flex;
      flex: 1;
      gap: 15px;
      min-height: 0;
    }

    /* 左側：1?99のグリッド一覧 */
    .board-section {
      flex: 1;
      background: #1e1e2f;
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 6px;
      border: 2px solid #3a3a5a;
    }
    .board-cell {
      background-color: #2a2a40;
      color: #57606f;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .board-cell:active {
      transform: scale(0.92);
    }

    /* 出た数字 */
    .board-cell.hit {
      background-color: #2ed573;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.4);
    }
    /* 最新の数字 */
    .board-cell.latest-hit {
      background-color: #ffcc00;
      color: #121212;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
      animation: pop 0.3s ease-out;
    }

    /* 右側：最新表示 & コントロールエリア */
    .sidebar {
      width: 32%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .main-display {
      flex: 1;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 2px solid #3a3a5a;
      position: relative;
    }
    .label {
      font-size: 1.4rem;
      color: #a0a0c0;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .current-number {
      font-size: 8.5rem;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
      line-height: 1;
    }

    /* キーボード入力中の数字バッファ表示 */
    .key-buffer {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 1.2rem;
      color: #8888aa;
    }
    .key-buffer span {
      color: #ffffff;
      font-weight: bold;
      font-size: 1.5rem;
    }

    /* モード切替エリア */
    .control-panel {
      background: #1e1e2f;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 2px solid #3a3a5a;
    }
    .mode-title {
      font-size: 0.85rem;
      color: #a0a0c0;
      text-align: center;
    }
    .mode-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-mode {
      flex: 1;
      font-size: 1.2rem;
      padding: 14px 0;
      border-radius: 8px;
      border: 2px solid transparent;
      background-color: #2f3542;
      color: #747d8c;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-mode.active-add {
      background-color: #2ed573;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(46, 213, 115, 0.5);
    }
    .btn-mode.active-delete {
      background-color: #ff4757;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
    }

    @keyframes pop {
      0% { transform: scale(0.7); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="board-section" id="board"></div>

    <div class="sidebar">
      <div class="main-display">
        <div class="label">LATEST</div>
        <div class="current-number" id="currentNumber">--</div>
        <div class="key-buffer" id="keyBufferDisplay">入力: <span id="keyBuffer">--</span></div>
      </div>

      <div class="control-panel">
        <div class="mode-title">タップ / キー入力動作</div>
        <div class="mode-buttons">
          <button id="modeAddBtn" class="btn-mode active-add" onclick="setMode('add')">追加</button>
          <button id="modeDeleteBtn" class="btn-mode" onclick="setMode('delete')">削除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let history = [];
    let currentMode = 'add';
    let keyBuffer = '';
    let keyTimer = null;
    const boardEl = document.getElementById('board');

    // 1?99のセル生成
    for (let i = 1; i <= 99; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.id = `cell-${i}`;
      cell.textContent = i;
      cell.onclick = () => processNumber(i);
      boardEl.appendChild(cell);
    }

    // モード切り替え
    function setMode(mode) {
      currentMode = mode;
      const addBtn = document.getElementById('modeAddBtn');
      const delBtn = document.getElementById('modeDeleteBtn');

      if (mode === 'add') {
        addBtn.className = 'btn-mode active-add';
        delBtn.className = 'btn-mode';
      } else {
        addBtn.className = 'btn-mode';
        delBtn.className = 'btn-mode active-delete';
      }
    }

    // 数字の処理（追加または削除）
    function processNumber(num) {
      if (num < 1 || num > 99) return;

      if (currentMode === 'add') {
        if (!history.includes(num)) {
          history.push(num);
        }
      } else {
        history = history.filter(n => n !== num);
      }
      updateDisplay();
    }

    // PCキーボード入力対応（input不要）
    document.addEventListener('keydown', (e) => {
      // 1?9の数字キー（テンキー含む）
      if (e.key >= '0' && e.key <= '9') {
        clearTimeout(keyTimer);
        keyBuffer += e.key;

        // 2桁入力されたら即時確定、または1秒待機
        const val = parseInt(keyBuffer, 10);
        document.getElementById('keyBuffer').textContent = keyBuffer;

        if (keyBuffer.length >= 2) {
          processNumber(val);
          resetKeyBuffer();
        } else {
          keyTimer = setTimeout(() => {
            processNumber(parseInt(keyBuffer, 10));
            resetKeyBuffer();
          }, 1200);
        }
      } else if (e.key === 'Enter') {
        if (keyBuffer !== '') {
          clearTimeout(keyTimer);
          processNumber(parseInt(keyBuffer, 10));
          resetKeyBuffer();
        }
      } else if (e.key === 'Backspace' || e.key === 'Escape') {
        clearTimeout(keyTimer);
        resetKeyBuffer();
      }
    });

    function resetKeyBuffer() {
      keyBuffer = '';
      document.getElementById('keyBuffer').textContent = '--';
    }

    // 表示更新
    function updateDisplay() {
      for (let i = 1; i <= 99; i++) {
        const cell = document.getElementById(`cell-${i}`);
        cell.className = 'board-cell';
      }

      if (history.length === 0) {
        document.getElementById('currentNumber').textContent = '--';
        return;
      }

      history.forEach(num => {
        const cell = document.getElementById(`cell-${num}`);
        if (cell) cell.className = 'board-cell hit';
      });

      const latest = history[history.length - 1];
      const latestCell = document.getElementById(`cell-${latest}`);
      if (latestCell) latestCell.className = 'board-cell latest-hit';
      
      document.getElementById('currentNumber').textContent = latest;
    }
  </script>
</body>
</html>
