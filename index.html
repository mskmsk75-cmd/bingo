<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ビンゴ当選番号モニター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      /* dvhに対応（モバイルのアドレスバーの高さを自動考慮） */
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      padding: 1vw;
      display: flex;
      gap: 1vw;
      user-select: none;
      overflow: hidden;
    }

    /* 左側：1〜99のグリッド一覧 */
    .board-section {
      flex: 1;
      height: 100%;
      background: #1e1e2f;
      border-radius: 12px;
      padding: 0.8vw;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 0.3vw;
      border: 2px solid #3a3a5a;
      min-height: 0; /* 画面内に収まるよう縮小を許可 */
    }
    .board-cell {
      background-color: #2a2a40;
      color: #57606f;
      /* 縦長・横長どちらの画面でも収まるようフォントサイズを自動調整 */
      font-size: min(2.5vw, 3.5vh);
      font-weight: 900;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-height: 0;
    }
    .board-cell:active {
      transform: scale(0.92);
    }

    /* 出た数字 */
    .board-cell.hit {
      background-color: #2ed573;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.4);
    }
    /* 最新の数字 */
    .board-cell.latest-hit {
      background-color: #ffcc00;
      color: #121212;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
      animation: pop 0.3s ease-out;
    }

    /* 右側：最新表示 & コントロールエリア */
    .sidebar {
      width: 28vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1vw;
      min-height: 0;
    }
    
    .main-display {
      flex: 1;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 2px solid #3a3a5a;
      padding: 5px;
      min-height: 0;
    }
    .label {
      font-size: min(1.8vw, 2.5vh);
      color: #a0a0c0;
      letter-spacing: 2px;
      margin-bottom: 0.2vh;
    }
    .current-number {
      font-size: min(14vw, 18vh);
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 35px rgba(255, 204, 0, 0.6);
      line-height: 1;
    }

    /* モード切替エリア */
    .control-panel {
      background: #1e1e2f;
      border-radius: 10px;
      padding: 0.8vw;
      display: flex;
      flex-direction: column;
      gap: 0.4vw;
      border: 2px solid #3a3a5a;
    }
    .mode-title {
      font-size: min(0.8vw, 1.3vh);
      color: #a0a0c0;
      text-align: center;
    }
    .mode-buttons {
      display: flex;
      gap: 0.8vw;
    }
    .btn-mode {
      flex: 1;
      font-size: min(1.2vw, 1.8vh);
      padding: 1vh 0;
      border-radius: 6px;
      border: 2px solid transparent;
      background-color: #2f3542;
      color: #747d8c;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-mode.active-add {
      background-color: #2ed573;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(46, 213, 115, 0.5);
    }
    .btn-mode.active-delete {
      background-color: #ff4757;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
    }

    @keyframes pop {
      0% { transform: scale(0.7); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="board-section" id="board"></div>

  <div class="sidebar">
    <div class="main-display">
      <div class="label">LATEST</div>
      <div class="current-number" id="currentNumber">--</div>
    </div>

    <div class="control-panel">
      <div class="mode-title">タップ / キー入力動作</div>
      <div class="mode-buttons">
        <button id="modeAddBtn" class="btn-mode active-add" onclick="setMode('add')">追加</button>
        <button id="modeDeleteBtn" class="btn-mode" onclick="setMode('delete')">削除</button>
      </div>
    </div>
  </div>

  <script>
    let history = [];
    let currentMode = 'add';
    let keyBuffer = '';
    let keyTimer = null;
    const boardEl = document.getElementById('board');

    // 1〜99のセル生成
    for (let i = 1; i <= 99; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.id = `cell-${i}`;
      cell.textContent = i;
      cell.onclick = () => processNumber(i);
      boardEl.appendChild(cell);
    }

    // 画面リロード・退出時の警告ダイアログ
    window.addEventListener('beforeunload', (e) => {
      if (history.length > 0) {
        e.preventDefault();
        e.returnValue = '番号がリセットされますがよろしいですか？';
      }
    });

    // モード切り替え
    function setMode(mode) {
      currentMode = mode;
      const addBtn = document.getElementById('modeAddBtn');
      const delBtn = document.getElementById('modeDeleteBtn');

      if (mode === 'add') {
        addBtn.className = 'btn-mode active-add';
        delBtn.className = 'btn-mode';
      } else {
        addBtn.className = 'btn-mode';
        delBtn.className = 'btn-mode active-delete';
      }
    }

    // 数字の処理
    function processNumber(num) {
      if (num < 1 || num > 99) return;

      if (currentMode === 'add') {
        if (!history.includes(num)) {
          history.push(num);
        }
      } else {
        history = history.filter(n => n !== num);
      }
      updateDisplay();
    }

    // キーボード入力対応
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        clearTimeout(keyTimer);
        keyBuffer += e.key;

        const val = parseInt(keyBuffer, 10);

        if (keyBuffer.length >= 2) {
          processNumber(val);
          keyBuffer = '';
        } else {
          keyTimer = setTimeout(() => {
            processNumber(parseInt(keyBuffer, 10));
            keyBuffer = '';
          }, 1200);
        }
      } else if (e.key === 'Enter') {
        if (keyBuffer !== '') {
          clearTimeout(keyTimer);
          processNumber(parseInt(keyBuffer, 10));
          keyBuffer = '';
        }
      } else if (e.key === 'Backspace' || e.key === 'Escape') {
        clearTimeout(keyTimer);
        keyBuffer = '';
      }
    });

    // 表示更新
    function updateDisplay() {
      for (let i = 1; i <= 99; i++) {
        const cell = document.getElementById(`cell-${i}`);
        cell.className = 'board-cell';
      }

      if (history.length === 0) {
        document.getElementById('currentNumber').textContent = '--';
        return;
      }

      history.forEach(num => {
        const cell = document.getElementById(`cell-${num}`);
        if (cell) cell.className = 'board-cell hit';
      });

      const latest = history[history.length - 1];
      const latestCell = document.getElementById(`cell-${latest}`);
      if (latestCell) latestCell.className = 'board-cell latest-hit';
      
      document.getElementById('currentNumber').textContent = latest;
    }
  </script>
</body>
</html>
