<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ビンゴ当選番号モニター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .main-container {
      display: flex;
      flex: 1;
      gap: 20px;
      min-height: 0;
    }

    /* 左側：1?99のグリッド一覧 */
    .board-section {
      flex: 1;
      background: #1e1e2f;
      border-radius: 16px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 6px;
      border: 2px solid #3a3a5a;
    }
    .board-cell {
      background-color: #2a2a40;
      color: #57606f;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
      border: 2px solid transparent;
    }
    .board-cell:hover {
      border-color: #7070a0;
    }
    /* 出た数字 */
    .board-cell.hit {
      background-color: #2ed573;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.4);
    }
    /* 最新の数字 */
    .board-cell.latest-hit {
      background-color: #ffcc00;
      color: #121212;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
      animation: pop 0.3s ease-out;
    }
    /* 削除用に選択中のスタイル */
    .board-cell.selected-for-delete {
      border: 3px solid #ff4757 !important;
      transform: scale(0.95);
    }

    /* 右側：最新表示 & コントロールエリア */
    .sidebar {
      width: 32%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .main-display {
      flex: 1;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 2px solid #3a3a5a;
    }
    .label {
      font-size: 1.5rem;
      color: #a0a0c0;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .current-number {
      font-size: 9rem;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
      line-height: 1;
    }

    /* 入力 & 操作エリア */
    .control-panel {
      background: #1e1e2f;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 2px solid #3a3a5a;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="number"] {
      flex: 1;
      font-size: 1.6rem;
      padding: 8px;
      border-radius: 8px;
      border: none;
      text-align: center;
      outline: none;
      width: 0;
    }
    .btn-add {
      font-size: 1.1rem;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: #2ed573;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add:hover { background-color: #26af5f; }

    .btn-delete {
      font-size: 1.1rem;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: #ff4757;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-delete:hover { background-color: #ff6b81; }

    @keyframes pop {
      0% { transform: scale(0.7); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="board-section" id="board"></div>

    <div class="sidebar">
      <div class="main-display">
        <div class="label">LATEST</div>
        <div class="current-number" id="currentNumber">--</div>
      </div>

      <div class="control-panel">
        <div class="input-row">
          <input type="number" id="numInput" min="1" max="99" placeholder="当選番号" autofocus>
          <button class="btn-add" onclick="addNumber()">追加</button>
          <button class="btn-delete" onclick="deleteSelected()">削除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let history = [];
    const selectedForDelete = new Set();
    const boardEl = document.getElementById('board');

    // 1?99のセル生成
    for (let i = 1; i <= 99; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.id = `cell-${i}`;
      cell.textContent = i;
      cell.onclick = () => toggleSelectCell(i);
      boardEl.appendChild(cell);
    }

    // 番号を追加
    function addNumber() {
      const input = document.getElementById('numInput');
      const val = parseInt(input.value, 10);

      if (isNaN(val) || val < 1 || val > 99) {
        alert('1から99までの数字を入力してください。');
        input.value = '';
        input.focus();
        return;
      }

      if (history.includes(val)) {
        alert('その数字はすでに出ています！');
        input.value = '';
        input.focus();
        return;
      }

      history.push(val);
      updateDisplay();

      input.value = '';
      input.focus();
    }

    // 左側の番号をクリックしたときの動作（削除候補として選択/解除）
    function toggleSelectCell(num) {
      if (!history.includes(num)) return;

      if (selectedForDelete.has(num)) {
        selectedForDelete.delete(num);
      } else {
        selectedForDelete.add(num);
      }
      updateCellSelectionStyles();
    }

    // 「削除」ボタンを押したときの処理
    function deleteSelected() {
      const input = document.getElementById('numInput');
      const inputVal = parseInt(input.value, 10);

      if (!isNaN(inputVal) && history.includes(inputVal)) {
        selectedForDelete.add(inputVal);
      }

      if (selectedForDelete.size === 0) {
        alert('削除したい番号をクリックして選択するか、入力欄に指定してください。');
        return;
      }

      history = history.filter(num => !selectedForDelete.has(num));
      selectedForDelete.clear();

      updateDisplay();

      input.value = '';
      input.focus();
    }

    // セルの選択状態（赤枠）の見た目を更新
    function updateCellSelectionStyles() {
      for (let i = 1; i <= 99; i++) {
        const cell = document.getElementById(`cell-${i}`);
        if (selectedForDelete.has(i)) {
          cell.classList.add('selected-for-delete');
        } else {
          cell.classList.remove('selected-for-delete');
        }
      }
    }

    // 全体の表示状態を更新
    function updateDisplay() {
      for (let i = 1; i <= 99; i++) {
        const cell = document.getElementById(`cell-${i}`);
        cell.className = 'board-cell';
      }

      if (history.length === 0) {
        document.getElementById('currentNumber').textContent = '--';
        selectedForDelete.clear();
        return;
      }

      history.forEach(num => {
        const cell = document.getElementById(`cell-${num}`);
        if (cell) cell.className = 'board-cell hit';
      });

      const latest = history[history.length - 1];
      const latestCell = document.getElementById(`cell-${latest}`);
      if (latestCell) latestCell.className = 'board-cell latest-hit';
      
      document.getElementById('currentNumber').textContent = latest;

      updateCellSelectionStyles();
    }

    // Enterキー対応
    document.getElementById('numInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addNumber();
      }
    });
  </script>
</body>
</html>
